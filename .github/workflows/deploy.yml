name: 'Deploy Application'

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: 'Build and Deploy'
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Stop existing container
        run: |
          docker stop togglemaster 2>/dev/null || true
          docker rm togglemaster 2>/dev/null || true

      - name: Build Docker image
        run: docker build -t togglemaster .

      - name: Run container
        run: |
          docker run -d \
            --name togglemaster \
            --restart unless-stopped \
            -p 5000:5000 \
            -e DB_HOST=${{ secrets.DB_HOST }} \
            -e DB_NAME=${{ secrets.DB_NAME }} \
            -e DB_USER=${{ secrets.DB_USER }} \
            -e DB_PASSWORD=${{ secrets.DB_PASSWORD }} \
            -e DB_PORT=5432 \
            togglemaster

      - name: Health check
        run: |
          echo "Aguardando aplicacao iniciar..."
          sleep 10
          curl -f http://localhost:5000/health || echo "Health check falhou - verificar logs com: docker logs togglemaster"
